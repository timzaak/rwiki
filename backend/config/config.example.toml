# Rwiki Backend Configuration
# Copy this file to config.toml and adjust the values.
#
# Development: copy to config/config.toml
# Demo:        copy to config/demo.toml
#
# Embedding API Key can be set via environment variables (override the file):
#   OPENAI_API_KEY     — OpenAI Embedding API Key

[server]
# Bind address
bind_address = "0.0.0.0:8080"
# Log level: trace, debug, info, warn, error
log_level = "info"
# Runtime environment: development, demo, test
app_env = "development"
# Enable OpenAPI/Swagger documentation
enable_openapi = true
# Static file directory (contains rwiki-chat.js, etc.)
# Set to "/app/static" for Docker deployments.
# Leave empty or unset to skip serving static files.
# static_dir = "/app/static"
# CORS allowed origins for the chat widget (embedded on third-party sites).
# Empty/unset = allow all origins (*), the default and backward-compatible
# behavior (the widget works on any site). List specific origins to lock down
# which sites may call /api/chat, preventing unauthorized use of your API.
# Can also be set via the CORS_ALLOWED_ORIGINS env var (comma-separated).
# allowed_origins = ["https://your-domain.com", "https://docs.example.com"]

[sqlite]
# SQLite database file path
path = "data/rwiki.db"

[llm]
# LLM API Key (required)
api_key = ""
# LLM API base URL (supports OpenAI-compatible providers)
# OpenAI:       https://api.openai.com/v1
# OpenRouter:   https://openrouter.ai/api/v1
# GLM (Zhipu):  https://open.bigmodel.cn/api/paas/v4
# Bailian (DashScope): https://dashscope.aliyuncs.com/compatible-mode/v1
base_url = "https://openrouter.ai/api/v1"
# Model name (use a model supported by the provider)
# OpenAI:       gpt-4o, gpt-4o-mini
# OpenRouter:   deepseek/deepseek-chat-v3-0324, anthropic/claude-sonnet-4-20250514
# GLM:          glm-4-plus, glm-4-flash
# Bailian:      qwen-plus, qwen-turbo
model = "deepseek/deepseek-chat-v3-0324"

[embedding]
# api_key = "sk-..."
# base_url = "https://api.openai.com/v1"
# model = "text-embedding-3-small"
# dimensions = 1536   # Optional; uses the model default when unset

# --- BigModel Embedding-3 ---
# api_key = "your-bigmodel-api-key"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
# model = "embedding-3"
# dimensions = 2048   # Optional; supports 256/512/1024/2048, uses the model default when unset

# --- Bailian (DashScope) Embedding ---
# api_key = "your-dashscope-api-key"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# model = "text-embedding-v3"
# dimensions = 1024   # Optional; supports 512/768/1024

[api]
# API Token for document management endpoints
# Leave empty to use the API_TOKEN environment variable
token = ""
# Optional API IP allow list for token-protected endpoints.
# Empty means token-only authentication remains unchanged.
# The checked address is the TCP peer IP seen by this service. If the service
# runs behind a reverse proxy, allow the proxy's source IP/range.
# Single IPs must be written as CIDR: IPv4 /32, IPv6 /128.
# Can also be set via API_ALLOWED_IP_RANGES as a comma-separated list.
# allowed_ip_ranges = ["203.0.113.10/32", "2001:db8::/32"]

[chat]
# System prompt (recommended; the built-in default is used when the [chat]
# section is omitted). Defines the role and behavior rules of the knowledge
# base assistant. RAG context is appended automatically after the prompt;
# you do not need to include it manually.
#
# Example (use triple quotes for multi-line text):
# system_prompt = """
# You are a technical documentation assistant focused on helping developers
# understand project docs.
# Rules:
# 1. Prefer code examples when explaining.
# 2. Cite the source title and section when quoting.
# """
system_prompt = "你是一个知识库助手。请根据以下上下文回答用户问题。\n规则：\n1. 如果上下文中没有相关信息，请明确告知用户。\n2. 引用信息时，请使用 [Source N] 格式标注来源编号，N 对应上下文中的 document index。\n3. 如果来源有链接，请在引用中附上链接，让用户可以直接访问原始页面。\n4. 如果多个来源提供相同信息，合并引用，如 [Source 1][Source 2]。\n5. 如果来源之间信息冲突，说明冲突并分别引用相关来源。\n6. 如果来源标注了语言（Locale），请在引用中提及信息的语言。"

# Sliding window size: keep the most recent N messages for context (default 6)
# sliding_window_size = 6

# Compaction threshold: trigger a compaction check when the message count
# exceeds this value (default 8)
# compact_threshold = 8

# Token budget: trigger compaction when the estimated token count exceeds this
# value (default 8000)
# token_budget = 8000

# Primary language of the knowledge base documents (e.g. "Chinese", "English").
# When set, query rewriting translates the user query into this language.
# content_language = "Chinese"

# Generate follow-up suggested questions after an answer (SSE `suggestions`
# event, up to 3 entries). When enabled, an extra non-streaming LLM call is
# appended after each main answer (max_tokens=200, 8s timeout). On failure,
# timeout, or parse error it degrades silently to emitting no suggestions
# event, and the main answer `done` event is unaffected. Off by default.
# Note the additional LLM call cost when enabled.
# enable_post_answer_suggestions = false

[retrieval]
# Number of candidates recalled per query variant (default 5)
# search_top_k_per_query = 5

# Maximum number of chunks fed into the LLM context (default 12)
# max_context_chunks = 12

[otel]
# OpenTelemetry OTLP tracing and metrics export config.
# When endpoint is empty, OTLP tracing and metrics are disabled (zero overhead
# for local development).
#
# OTLP gRPC endpoint (Alibaba Cloud ARMS example):
# endpoint = "https://tracing-analysis-dc-hz.aliyuncs.com:8090"
# Auth token; recommended to set via the OTEL_LICENSE_KEY environment variable
# license_key = ""
# Service name, defaults to "rwiki-backend"
# service_name = "rwiki-backend"

# Rerank (re-scoring) config.
# Enablement is decided by section presence: including a [rerank] section
# enables rerank; omitting the section entirely disables it (zero overhead).
# When enabled, candidates are semantically re-scored after RRF fusion +
# window expansion to improve retrieval precision. Rerank failures (network,
# timeout, auth, parse) degrade automatically to the RRF fusion results with
# no user-visible impact.
#
# Uncomment one of the provider blocks below to enable rerank. The [rerank]
# header line itself must be uncommented as well.
#
# --- OpenRouter Rerank (free, recommended) ---
# [rerank]
# provider = "open_router"         # "open_router" | "big_model" | "dash_scope"
# model = "cohere/rerank-v4-fast"
# top_n = 20
# timeout_secs = 3
# api_key = ""                      # Falls back to [llm].api_key when unset
#
# --- Zhipu BigModel Rerank (low latency in China) ---
# [rerank]
# provider = "big_model"
# model = "rerank-pro"
# top_n = 20
# timeout_secs = 3
# api_key = "your-bigmodel-api-key"  # BigModel requires its own key
#
# --- Alibaba Cloud Bailian (DashScope) Rerank ---
# [rerank]
# provider = "dash_scope"
# model = "qwen3-rerank"             # Recommended
# top_n = 20
# timeout_secs = 3
# api_key = ""                      # Falls back to [llm].api_key when unset
# base_url is optional; uses the provider default endpoint when unset
# (DashScope defaults to mainland China). Set it explicitly for other
# regions/gateways.
# base_url = ""

# 多频道配置（support-multiple-website）。
# 至少配置一个 [channels.<channelId>] 段，否则服务启动失败。
# 频道 ID 作为文档、聊天、反馈、低相关召回记录的作用域隔离键。
[channels.help_center]
name = "Help Center"
# system_prompt = """
# 你是 Help Center 的知识库助手。优先回答产品使用相关问题，语气简洁专业。
# """
# [channels.help_center.suggested_questions]
# default = ["如何快速上手", "系统支持哪些文件格式"]
# zh-CN = ["如何快速上手", "系统支持哪些文件格式", "如何联系客服"]
# en = ["How to get started", "What file formats are supported"]

# [low_recall] — 低相关召回记录（自动旁路记录相关性低于阈值的查询，供运营发现 KB 盲区）。
# Enablement 与 rerank 一致：包含 [low_recall] 段即启用；省略整段则关闭（零开销）。
# 启用后，每次 /api/chat 检索若 top-1 相关度分数低于 threshold，旁路写入一条记录
# （不改实时回答行为；写入失败不阻塞 chat）。建议与 [rerank] 一同启用——
# threshold 校准基于 rerank 的 0..1 relevance_score。
# [low_recall]
# threshold = 0.3   # 待首批记录校准

# [mcp] — MCP Server（把知识库问答/检索以 MCP 工具暴露给 Claude Code、Cursor 等 Agent 客户端）。
# Enablement 与 rerank/low_recall 一致：包含 [mcp] 段即启用（段本身无字段）；
# 省略整段则关闭，/mcp 路由不挂载，现有行为不变。
# 鉴权复用 [api] 段：客户端需携带 `Authorization: Bearer <API_TOKEN>` 请求头访问
# POST /mcp（Streamable HTTP 传输），并受 api.allowed_ip_ranges IP 白名单约束。
# 接入示例：claude mcp add --transport http rwiki http://<host>:<port>/mcp \
#   --header "Authorization: Bearer <API_TOKEN>"
# [mcp]
