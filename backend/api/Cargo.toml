[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rwiki-core = { path = "../core" }

# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
tokio-rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
ipnet = { workspace = true }

# Configuration
clap = { workspace = true }
toml = { workspace = true }
dotenv = { workspace = true }

# Streaming
tokio-stream = { workspace = true }
futures = "0.3"

# RAG / LLM
rig = { workspace = true }

# MCP (Model Context Protocol) server
rmcp = { workspace = true }
schemars = { workspace = true }

# Observability
opentelemetry = { workspace = true }

# API Documentation — utoipa 自动生成 OpenAPI 文档
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { workspace = true }
rust_xlsxwriter = "0.96"
sqlite-vec = { workspace = true }
mockito = "1"
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
http-body-util = "0.1"
tempfile = "3"
