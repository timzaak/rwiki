[package]
name = "rwiki-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-futures = { workspace = true }

# API Documentation
utoipa = { version = "5", features = ["chrono", "uuid"] }

# Database
rusqlite = { workspace = true }
tokio-rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
zerocopy = { workspace = true }
md5 = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
# sqlite-vec：SQLite 后端 vec0 虚表（storage_sqlite::ensure_sqlite_vec_loaded 注册）
sqlite-vec = { workspace = true }

# Time & ID
chrono = { workspace = true }
uuid = { workspace = true }

# Configuration
toml = { workspace = true }

# RAG / LLM
rig = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
calamine = { workspace = true }
text-splitter = { workspace = true }
pulldown-cmark = "0.13"

# Observability
opentelemetry = { workspace = true }

# Chinese word segmentation
jieba-rs = { workspace = true }

[features]
# 暴露 storage_testing 测试工厂（api/app 的 dev-dependencies 启用）
test-support = []

[dev-dependencies]
mockito = "1"
rust_xlsxwriter = "0.96"
tempfile = "3"
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
