[workspace]
resolver = "2"
members = [
    "core",  # crate name is rwiki-core to avoid conflict with Rust's built-in core
    "api",
    "app",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
rusqlite_migration = { version = "2.3" }
zerocopy = "0.8"
sqlite-vec = "0.1.9"

# Time & ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15"
md5 = "0.7"

# RAG / LLM
rig = { version = "0.38.1", features = ["derive"] }
calamine = "0.26"

# Text splitting
text-splitter = { version = "0.30", features = ["markdown"] }

# Chinese word segmentation
jieba-rs = "0.10"

# Streaming
tokio-stream = "0.1"

# Observability (OpenTelemetry + ARMS)
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = "0.32"
tracing-opentelemetry = "0.33"
tonic = "0.14"
