[workspace]
resolver = "2"
members = [
    "core",  # crate name is rwiki-core to avoid conflict with Rust's built-in core
    "api",
    "app",
]

[workspace.package]
version = "0.2.8"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
ipnet = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-rusqlite = { version = "0.14", package = "tokio-rusqlite-new" }
rusqlite_migration = { version = "2.6" }
zerocopy = "0.8"
sqlite-vec = "0.1.9"

# Time & ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-futures = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15"
md5 = "0.7"

# RAG / LLM
rig = { version = "0.39.0", features = ["derive"] }
calamine = "0.35"

# MCP (Model Context Protocol) server
rmcp = { version = "=3.1.4", features = ["transport-streamable-http-server"] }
# schemars 1.x 直接依赖：rmcp 的 JsonSchema derive 生成的代码以绝对路径引用
# schemars crate，消费方必须直接依赖（与 utoipa 5 的旧版 schemars 0.9 共存，仅增编译体积）
schemars = "1.2.1"

# Text splitting
text-splitter = { version = "0.32", features = ["markdown"] }

# Chinese word segmentation
jieba-rs = "0.10"

# Streaming
tokio-stream = "0.1"

# Observability (OpenTelemetry + ARMS)
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics"] }
tracing-opentelemetry = "0.33"
tonic = "0.14"
