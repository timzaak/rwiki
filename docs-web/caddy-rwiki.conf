# Target Caddy block for rwiki.fornetcode.com serving the docs-web static build
# plus the backend reverse proxies.
#
# docs-web is a TanStack Start prerender: each route is a folder with an
# index.html, and client-side routing falls back to _shell.html. Gotchas:
#
#   1. The bare root "/" has no index.html (the shell client-redirects to
#      /en). Caddy's try_files stops at the existing "/" directory (no index)
#      and returns 404 instead of continuing to the /_shell.html fallback, so
#      the root needs an explicit rewrite.
#   2. /api/search is a STATIC file (the prerendered search index, no file
#      extension) and must be carved out BEFORE the `handle /api/*` backend
#      proxy — otherwise it is proxied to the backend, which has no such
#      route and the Ctrl+K search breaks (exactly what the previous block
#      did to the live site).
#   3. Static-looking paths (favicon.ico, any missing *.png probe) must NOT
#      fall back to the shell: 200 + HTML on an image URL is the worst case
#      for crawlers and icon fetchers. Those paths go through a plain
#      file_server, so missing files 404.
#
# Replace the existing rwiki.fornetcode.com block in /server/conf/caddy/Caddyfile
# with this, then restart the caddy container (NOT just reload) — the Caddyfile
# and /srv/rwiki are bind-mounted, and `mv`/`awk+mv` swaps the inode, which a
# running container does not re-resolve. A `docker restart caddy` re-resolves
# both bind mounts to the current path.
rwiki.fornetcode.com {
    root * /srv/rwiki
    encode gzip
    # Static search index (prerendered file, extensionless) — before /api/*.
    @searchstatic path /api/search /api/search/*
    handle @searchstatic {
        file_server
    }
    handle /api/* {
        reverse_proxy rwiki:8080
    }
    @backend path /health /swagger* /widget/* /mcp/*
    handle @backend {
        reverse_proxy rwiki:8080
    }
    @root path /
    rewrite @root /_shell.html
    @asset path *.png *.ico *.svg *.jpg *.jpeg *.gif *.webp *.avif *.bmp *.xml *.txt *.json *.md *.map *.woff *.woff2 *.ttf *.otf *.css *.js *.mjs *.wasm
    handle @asset {
        file_server
    }
    handle {
        try_files {path} {path}/ /_shell.html
        file_server
    }
}
